name: testes

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      # O modelo de embeddings local (~220 MB) é baixado na primeira execução e reaproveitado depois.
      - uses: actions/cache@v4
        with:
          path: .cache/fastembed
          key: fastembed-minilm-v1

      - name: Instalar
        run: |
          pip install -r requirements.txt
          pip install -e .

      # Nenhum teste chama a API da OpenAI: o LLM é simulado, então não há segredo no CI.
      - name: Testes
        run: pytest -q
